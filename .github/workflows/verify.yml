name: verify

'on':
  push:
    branches: ['next/*', 'phase/*', 'main']
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup test environment
        run: |
          # Create QA account fixture for CI
          mkdir -p apps/api/data
          cat > apps/api/data/qa-account.local.json << 'EOF'
          {
            "name": "M2 QA",
            "email": "m2-qa2@speeko.test",
            "password": "AbI5LqGYA49cOe1dbz2DBHgg",
            "userId": "iUeOMkEaO4qYU1VLDA9TCfILBekxRWr2",
            "note": "Local PGlite throwaway account in apps/api/data for M2 functional QA. Not production. Local file only; do not commit."
          }
          EOF

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Secrets scan
        run: pnpm check:secrets

      - name: E2E
        run: pnpm e2e
        env:
          CI: '1'
          NODE_ENV: 'test'
          RATE_LIMIT_DISABLED: '1'
