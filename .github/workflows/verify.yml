name: verify

'on':
  push:
    branches: ['next/*', 'phase/*', 'main']
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Provision QA account for e2e
        run: |
          mkdir -p apps/api/data
          QA_PASS=$(openssl rand -hex 12)
          node apps/api/dist/index.js &
          API_PID=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3001/health >/dev/null && break; sleep 1; done
          RESPONSE=$(curl -s -X POST http://127.0.0.1:3001/api/auth/sign-up/email \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d "{\"name\":\"M2 QA\",\"email\":\"m2-qa2@speeko.test\",\"password\":\"$QA_PASS\"}")
          export RESPONSE QA_PASS
          node -e '
            const r = JSON.parse(process.env.RESPONSE);
            const id = (r && r.user && r.user.id) || (r && r.data && r.data.user && r.data.user.id);
            if (!id) { console.error("QA sign-up failed:", JSON.stringify(r)); process.exit(1); }
            require("fs").writeFileSync("apps/api/data/qa-account.local.json", JSON.stringify({
              name: "M2 QA",
              email: "m2-qa2@speeko.test",
              password: process.env.QA_PASS,
              userId: id,
              note: "CI-provisioned throwaway account. Not for real use."
            }, null, 2));
          '
          kill $API_PID || true
          wait $API_PID || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Secrets scan
        run: pnpm check:secrets

      - name: E2E
        run: pnpm e2e
        env:
          CI: '1'
          RATE_LIMIT_DISABLED: '1'
