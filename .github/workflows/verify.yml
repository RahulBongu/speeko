name: verify

'on':
  push:
    branches: ['next/*', 'phase/*', 'main']
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Secrets scan
        run: pnpm check:secrets

      - name: License texts
        run: pnpm check:licenses

      - name: E2E
        run: pnpm e2e
        env:
          CI: '1'
