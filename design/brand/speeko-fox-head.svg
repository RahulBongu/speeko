<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Speeko fox head mark — full color -->
  <!-- Left ear -->
  <polygon points="20,44 14,14 42,28" fill="#F97316" stroke="#3F2A1D" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="22,40 18,20 36,30" fill="#FED7AA" stroke="#3F2A1D" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right ear -->
  <polygon points="80,44 86,14 58,28" fill="#F97316" stroke="#3F2A1D" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="78,40 82,20 64,30" fill="#FED7AA" stroke="#3F2A1D" stroke-width="2" stroke-linejoin="round"/>
  <!-- Head base -->
  <ellipse cx="50" cy="56" rx="36" ry="30" fill="#F97316" stroke="#3F2A1D" stroke-width="4"/>
  <!-- Cheeks/snout cream patch -->
  <path d="M 24,56 C 24,74 36,82 50,82 C 64,82 76,74 76,56 C 76,46 64,50 50,56 C 36,50 24,46 24,56 Z" fill="#FFFDF6" stroke="#3F2A1D" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="38" cy="50" r="4.5" fill="#3F2A1D"/>
  <circle cx="39.5" cy="48.5" r="1.5" fill="#FFFDF6"/>
  <circle cx="62" cy="50" r="4.5" fill="#3F2A1D"/>
  <circle cx="63.5" cy="48.5" r="1.5" fill="#FFFDF6"/>
  <!-- Bindi dot (Indian flair) -->
  <circle cx="50" cy="42" r="3" fill="#DC2626"/>
  <!-- Nose -->
  <ellipse cx="50" cy="64" rx="4" ry="2.5" fill="#3F2A1D"/>
  <!-- Mouth line -->
  <path d="M 46,67 Q 50,71 54,67" fill="none" stroke="#3F2A1D" stroke-width="3" stroke-linecap="round"/>
</svg>
