<script>
    // Tab switching interactivity
    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    
    function setSignInActive() {
      tabSignIn.className = "flex-1 py-2 px-4 rounded-full bg-primary text-on-primary font-label-md font-label-md font-black shadow-[0_3px_0_0_#005320] border border-on-primary-fixed-variant transition-all text-center";
      tabSignUp.className = "flex-1 py-2 px-4 rounded-full text-on-surface font-label-md font-label-md font-bold hover:text-primary transition-all text-center";
    }

    function setSignUpActive() {
      tabSignUp.className = "flex-1 py-2 px-4 rounded-full bg-primary text-on-primary font-label-md font-label-md font-black shadow-[0_3px_0_0_#005320] border border-on-primary-fixed-variant transition-all text-center";
      tabSignIn.className = "flex-1 py-2 px-4 rounded-full text-on-surface font-label-md font-label-md font-bold hover:text-primary transition-all text-center";
    }

    tabSignIn.addEventListener('click', setSignInActive);
    tabSignUp.addEventListener('click', setSignUpActive);
  </script>
